name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. Nothing here is worth
# paying for twice, and a queued stale run only delays the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow reads code and nothing else. Anything needing more permission
# should be a separate, explicitly scoped job.
permissions:
  contents: read

env:
  # Never resolves to a live provider in CI. The deterministic composer is the
  # default path in production too, so this tests the real thing rather than a
  # stub — and no workflow run can spend money.
  LLM_PROVIDER: mock

jobs:
  verify:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Required by AGENTS.md and not redundant with typecheck: the Next build
      # catches route and server/client boundary errors that tsc does not.
      - run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Only Chromium: both Playwright projects are Chromium-based, so pulling
      # Firefox and WebKit would add minutes and test nothing.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
